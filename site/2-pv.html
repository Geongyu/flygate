<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyGate — 2 · 시판 후 감시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* 색·컴포넌트 토큰은 FDDD(fly-connectome-template) src/style.css 에서 가져옴.
   글자 크기만 가독성을 위해 상향. 크레딧은 각 화면 푸터에 표시. */
:root{
--bg:#060B13; --panel:#080F1A; --panel2:#0B1421; --panel3:#101B2B;
--line:#1D2B3D; --line2:#2B3D53; --line3:#25405E;
--text:#DCE8F4; --bright:#EDF6FF; --muted:#8093AC; --muted2:#92A8BE;
--accent:#65D9F1; --ok:#70F2B8; --warn:#FFC445; --no:#FF8B35; --human:#B76CFF; --ligand:#DDBB65;
--r:7px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'DM Sans','IBM Plex Sans KR',system-ui,sans-serif;color:var(--text);font-size:15px;line-height:1.5;font-synthesis:none}
a{color:#9DC7E2;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit;color:var(--text);background:#101C2B;border:1px solid var(--line2);border-radius:5px;cursor:pointer}
button:hover{border-color:#78B7DC;color:#FFFFFF}
button:focus-visible{outline:2px solid #4EE4FF;outline-offset:4px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.13em;color:#7392AE;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--bright)}
.trow{background:transparent;border-radius:0}
.trow:hover{background:#17263A;border-color:transparent}
.foot{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#516A83}
.foot a{color:#779AB7}
@keyframes fadeA{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadeB{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live{animation:pulse 2s ease-in-out infinite}
.bar{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.grow{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</style>
<style>
/* 스탠드얼론 전용 보정: 좁은 화면에서 오른쪽이 잘리지 않게 한다 */
body{overflow-x:hidden}
#app>div{margin:0 auto}
</style>
</head>
<body>
<template id="tpl">
<div style="width: 100%; max-width: 1440px; min-height: 1720px; height: auto; display: flex; flex-direction: column; background: var(--bg);">

<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); background: #080E17;">
<div style="display: flex; align-items: baseline; gap: 16px;">
<span style="font-size: 22px; font-weight: 600; letter-spacing: 5px;">FLYGATE</span>
<span style="font-size: 14px; color: var(--muted2);">약물감시 콘솔</span>
<span class="mono" style="font-size: 12px; letter-spacing: .1em; color: var(--human); border: 1px solid #3D2B55; border-radius: 4px; padding: 4px 10px;">STEP 2 / 2 · 시판 후 감시</span>
</div>

</header>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 24px 32px 28px;">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="display: flex; align-items: center; gap: 10px;"><span class="mono" style="font-size: 12px; color: var(--accent);">← STEP 1</span><span class="lbl" style="letter-spacing:.13em;">니라파립 · PARP1 도킹 -10.178 · Boltz-2 pIC50 8.91</span></span>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.5px;">시판 후 이상사례 평가</h1>
<span style="font-size: 14px; color: var(--muted2);">니라파립 (ZEJULA) × 혈소판감소증 · 보고 우선 분류</span>
<span class="mono" style="display: inline-flex; align-items: center; gap: 8px; width: fit-content; margin-top: 4px; font-size: 13px; color: var(--muted2); border: 1px solid var(--line2); border-radius: 5px; padding: 6px 12px;">확률은 Jev 1.13.0 실측 · 보고 6건 중 3건은 실제 FAERS, 3건은 합성 예시</span>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<button type="button" onClick="{{ toggleJev }}" style="height: 46px; padding: 0 20px; border-radius: var(--r); cursor: pointer; font-size: 15px; font-weight: 600; border: 1px solid {{ jv.bd }}; background: {{ jv.bg }}; color: {{ jv.fg }};">{{ jv.label }}</button>
<button type="button" onClick="{{ next }}" style="height: 46px; padding: 0 20px; border-radius: var(--r); cursor: pointer; font-size: 15px; font-weight: 600; border: 1px solid var(--accent); background: var(--accent); color: #08131A;">다음 보고서</button>
</div>
</div>

<div role="tablist" style="display: flex; gap: 8px; border-bottom: 1px solid var(--line); flex-shrink: 0;">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" onClick="{{ t.pick }}" style="height: 46px; padding: 0 22px; border: 0; border-bottom: 2px solid {{ t.bd }}; border-radius: 0; background: transparent; font-size: 15px; font-weight: 600; color: {{ t.fg }}; cursor: pointer;">{{ t.label }}</button>
</sc-for>
</div>
<sc-if value="{{ isMain }}" hint-placeholder-val="{{ isMain }}">
<div class="card" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); overflow: hidden; flex-shrink: 0;">
<sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);">
<span class="lbl" style="font-size: 11px;">{{ t.k }}</span>
<span class="mono" style="font-size: 28px; color: {{ t.c }};">{{ t.v }}</span>
<span style="font-size: 13px; color: var(--muted2);">{{ t.s }}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: 420px minmax(0, 1fr) 440px; gap: 20px; flex-grow: 1; min-height: 0;">

<section class="card" style="display: flex; flex-direction: column; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
<h2 class="h2">보고 큐</h2>
<span class="mono" style="margin-left: auto; font-size: 12px; color: var(--muted);">Jev p(관련)</span>
</div>
<div style="display: flex; flex-direction: column; flex-grow: 1;">
<sc-for list="{{ reports }}" as="r" hint-placeholder-count="6">
<button type="button" class="trow" onClick="{{ r.pick }}" style="display: flex; flex-direction: column; gap: 10px; min-height: 92px; padding: 14px 20px; text-align: left; cursor: pointer; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid {{ r.edge }}; color: var(--text); background: {{ r.bg }}; transition: background .2s;">
<span style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 12px;">
<span style="display: flex; align-items: center; gap: 8px;"><span class="mono" style="font-size: 13px; color: var(--muted2);">{{ r.id }}</span><span class="mono" style="font-size: 11px; color: {{ r.srcC }};">{{ r.srcLabel }}</span></span>
<span class="mono" style="font-size: 12px; font-weight: 600; letter-spacing: .05em; padding: 4px 10px; border-radius: 5px; color: {{ r.rc }}; background: {{ r.rb }};">{{ r.route }}</span>
</span>
<span style="font-size: 14px; line-height: 1.5;">{{ r.meta }}</span>
<span style="display: flex; align-items: center; gap: 12px; width: 100%;">
<span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #1B2B3E;"><span class="bar" style="display: block; height: 6px; border-radius: 3px; width: {{ r.w }}; background: {{ r.rc }};"></span></span>
<span class="mono" style="font-size: 14px; width: 42px; text-align: right;">{{ r.p }}</span>
</span>
</button>
</sc-for>
</div>
<p style="margin: 0; padding: 14px 20px; font-size: 13px; line-height: 1.6; color: var(--muted2);">공개 FAERS에는 경과 서술이 없고, 인과성 미평가 사례가 섞여 있습니다.</p>
</section>

<section class="card" style="display: flex; flex-direction: column; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
<h2 class="h2">판단 경로</h2>
<span class="mono" style="margin-left: auto; font-size: 12px; color: var(--muted);">{{ sel.id }}</span>
</div>
<canvas ref="{{ brainRef }}" aria-label="판단 계층을 초파리 뇌 점구름 영역으로 표시" style="width: 100%; height: 290px; display: block; background: #070D17;"></canvas>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px 20px;">
<sc-for list="{{ tiers }}" as="t" hint-placeholder-count="3">
<div style="padding: 14px 16px; border-radius: var(--r); display: flex; flex-direction: column; gap: 5px; border: 1px solid {{ t.bd }}; background: {{ t.bg }}; opacity: {{ t.op }};">
<span class="lbl" style="font-size: 11px; color: {{ t.c }};">{{ t.k }}</span>
<span style="font-size: 15px; font-weight: 600;">{{ t.n }}</span>
<span style="font-size: 13px; line-height: 1.5; color: var(--muted2);">{{ t.s }}</span>
</div>
</sc-for>
</div>
<div style="margin: 0 20px 20px; padding: 16px 18px; border-radius: var(--r); background: var(--panel3); display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
<span style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;"><span class="lbl" style="font-size: 11px;">라우팅 근거 · Jev 문항 4개</span><sc-for list="{{ sel.q }}" as="q" hint-placeholder-count="4"><span class="mono" style="font-size: 12px; color: {{ q.c }};">{{ q.k }} {{ q.v }}</span></sc-for></span>
<span style="font-size: 15px; line-height: 1.6;">{{ sel.why }}</span>
</div>
</section>

<section class="card" style="display: flex; flex-direction: column; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line);">
<h2 class="h2">3단계 주장 검증</h2>
<span class="mono" style="margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--muted);"><span style="color: var(--ok);">✓ 통과</span><span style="color: var(--no);">✕ 반려</span><span style="color: var(--warn);">? 사람 확인</span><span>– 해당 없음</span></span>
</div>
<div style="display: flex; flex-direction: column;">
<sc-for list="{{ claims }}" as="c" hint-placeholder-count="4">
<button type="button" class="trow" onClick="{{ c.pick }}" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; text-align: left; cursor: pointer; border: 0; border-bottom: 1px solid var(--line); border-left: 3px solid {{ c.edge }}; color: var(--text); background: {{ c.bg }}; transition: background .2s;">
<span style="font-size: 14px; line-height: 1.55;">{{ c.text }}</span>
<span style="display: flex; gap: 8px; align-items: center; width: 100%;">
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 5px; color: {{ c.g1 }}; background: {{ c.b1 }};"><b style="font-size: 13px;">{{ c.s1 }}</b>근거 ID</span>
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 5px; color: {{ c.g2 }}; background: {{ c.b2 }};"><b style="font-size: 13px;">{{ c.s2 }}</b>숫자 대조</span>
<span class="mono" style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 5px; color: {{ c.g3 }}; background: {{ c.b3 }};"><b style="font-size: 13px;">{{ c.s3 }}</b>추론</span>
<span style="flex-grow: 1;"></span>
<span class="mono" style="font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 5px; color: {{ c.vc }}; background: {{ c.vb }};">{{ c.v }}</span>
</span>
</button>
</sc-for>
</div>
<div style="margin: 16px 20px 20px; padding: 16px 18px; border-radius: var(--r); background: var(--panel3); display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
<span class="lbl" style="font-size: 11px;">판정 사유</span>
<span style="font-size: 14px; line-height: 1.65;">{{ claim.reason }}</span>
<span class="mono" style="font-size: 12px; color: var(--muted); margin-top: auto;">{{ claim.ev }}</span>
</div>
</section>
</div>

<section class="card" style="display: grid; grid-template-columns: 300px 1fr 330px; overflow: hidden; flex-shrink: 0;">

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line);">
<span class="lbl">인과성 평가 · WHO-UMC</span>
<span style="font-size: 22px; font-weight: 600; color: {{ who.c }};">{{ who.label }}</span>
<span style="font-size: 13px; line-height: 1.6; color: var(--muted2);">{{ who.why }}</span>
</div>

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line);">
<div style="display: flex; align-items: baseline; gap: 14px;">
<span class="lbl">Naranjo 척도</span>
<span class="mono" style="font-size: 22px; font-weight: 600; color: {{ nar.c }};">{{ nar.score }}점</span>
<span style="font-size: 15px; font-weight: 600; color: {{ nar.c }};">{{ nar.label }}</span>
<span class="mono" style="margin-left: auto; font-size: 12px; color: var(--warn);">10문항 중 {{ nar.unknown }}개 판정 불가</span>
</div>
<div style="display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px;">
<sc-for list="{{ nar.items }}" as="q" hint-placeholder-count="10">
<span title="{{ q.t }}" style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
<span class="mono" style="font-size: 11px; color: var(--muted);">{{ q.n }}</span>
<span style="width: 100%; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: {{ q.bg }}; color: {{ q.fg }};" class="mono">{{ q.v }}</span>
</span>
</sc-for>
</div>
<span style="font-size: 13px; line-height: 1.6; color: var(--muted2);">공개 FAERS에는 경과 서술이 없어 재투여·혈중농도·용량반응 문항을 채울 수 없습니다. 점수는 남은 문항만으로 계산됩니다.</span>
</div>

<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; background: {{ gap.bg }};">
<span class="lbl" style="color: {{ gap.c }};">{{ gap.k }}</span>
<span style="font-size: 14px; line-height: 1.6;">{{ gap.text }}</span>
</div>
</section>

<div class="card" style="display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; overflow: hidden; flex-shrink: 0;">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line);">
<span class="lbl" style="font-size: 11px;">근거 넘어선 주장 적발 · 8건</span>
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; width: 110px; color: var(--muted2);">규칙만</span><span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #1B2B3E;"><span class="grow" style="display: block; width: 4%; height: 6px; border-radius: 3px; background: var(--muted);"></span></span><span class="mono" style="font-size: 14px; width: 40px; text-align: right;">0/4</span></div>
<div style="display: flex; align-items: center; gap: 14px;"><span style="font-size: 14px; width: 110px; color: var(--muted2);">+ Nemotron</span><span style="flex-grow: 1; height: 6px; border-radius: 3px; background: #1B2B3E;"><span class="grow" style="display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--accent); animation-delay: .15s;"></span></span><span class="mono" style="font-size: 14px; width: 40px; text-align: right;">4/4</span></div>
</div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">정상 주장 오반려</span><span class="mono" style="font-size: 26px; color: var(--warn);">1 / 4</span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">과잉해석 규칙</span><span class="mono" style="font-size: 26px;">15 <span style="font-size: 13px; color: var(--muted2);">종</span></span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;"><span class="lbl" style="font-size: 11px;">에이전트 도구</span><span class="mono" style="font-size: 26px;">8 <span style="font-size: 13px; color: var(--muted2);">종</span></span></div>
</div>

</div>
</sc-if>
<sc-if value="{{ isBench }}" hint-placeholder-val="{{ isBench }}">
<div style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: var(--muted2);">openFDA FAERS 전체 20,692,690건에서 약물 10종 × 상위 8사건 = 80쌍을 <b style="color: var(--text);">PRR ≥ 2 · χ² ≥ 4 · n ≥ 3</b> 기준으로 검사했습니다. 통계를 통과한 54건을 <b style="color: var(--text);">Jev 1.13.0</b>이 먼저 확률로 걸러내고, 애매한 것만 Nemotron이 분류합니다. Jev가 보고 서식 잡음으로 짚어낸 <b style="color: var(--accent);">{{ nart }}건</b>은 Nemotron의 범주로는 표현할 수 없던 것입니다. <span style="color: var(--warn);">두 모델의 분류 정확도는 아직 전문가가 검증하지 않았습니다.</span></p>
<div class="card" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); overflow: hidden; flex-shrink: 0;">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">검사한 약물–사건 쌍</span><span class="mono" style="font-size: 28px;">80</span><span style="font-size: 13px; color: var(--muted2);">약물 10종 × 상위 8사건</span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">통계 기준 통과</span><span class="mono" style="font-size: 28px; color: var(--warn);">54</span><span style="font-size: 13px; color: var(--muted2);">PRR≥2 · χ²≥4 · n≥3</span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">남은 검토 항목</span><span class="mono" style="font-size: 28px; color: var(--accent);">{{ nrev }} <span style="font-size: 15px; color: var(--muted2);">/ 54</span></span><span style="font-size: 13px; color: var(--muted2);">제외분도 필터로 다시 봄</span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line);"><span class="lbl" style="font-size: 11px;">자동 필터 제외율</span><span class="mono" style="font-size: 28px;">{{ ncut }}</span><span style="font-size: 13px; color: var(--warn);">전문가 검증 전</span></div>
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;"><span class="lbl" style="font-size: 11px;">라벨 대조 정밀도</span><span class="mono" style="font-size: 28px;">0.57</span><span style="font-size: 13px; color: var(--muted2);">민감도 0.72 · 철자 정규화 후</span></div>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; flex-grow: 1; min-height: 0;">

<div style="display: flex; flex-direction: column; gap: 20px; min-width: 0;">

<h2 class="h2">약물–사건 쌍</h2>
<div role="group" aria-label="필터" style="display: flex; gap: 8px; margin-left: auto;">

</sc-for>
</div>
</div>
<div class="lbl" style="display: grid; grid-template-columns: 1.2fr 2fr 0.75fr 0.8fr 1.3fr 0.9fr 1.15fr; gap: 14px; padding: 12px 20px; font-size: 11px; border-bottom: 1px solid var(--line);">
<span>약물</span><span>이상사례 (MedDRA PT)</span><span>보고 n</span><span>PRR</span><span>ROR 95% CI</span><span>라벨</span><span>분류</span>
</div>
<div style="overflow: hidden; flex-grow: 1;">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="14">
<div style="display: grid; grid-template-columns: 1.2fr 2fr 0.75fr 0.8fr 1.3fr 0.9fr 1.15fr; gap: 14px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); border-left: 3px solid {{ r.edge }};">
<span style="font-size: 14px; font-weight: 600;">{{ r.drug }}</span>
<span style="font-size: 14px; color: var(--muted2);">{{ r.event }}</span>
<span class="mono" style="font-size: 13px;">{{ r.n }}</span>

<span style="display: flex; flex-direction: column; gap: 2px; align-items: flex-start;"><span class="mono" style="font-size: 12px; padding: 4px 8px; border-radius: 4px; color: {{ r.catC }}; background: {{ r.catB }};">{{ r.cat }}</span><span class="mono" style="font-size: 11px; color: var(--accent);">{{ r.jev }}</span></span>

</section>
<section class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
<h2 class="h2">남은 한계</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; font-size: 13px; line-height: 1.6; color: var(--muted2);">
<p style="margin: 0;"><b>보고 서식 잡음은 Jev로 {{ nart }}건 걸러냈습니다.</b> OFF LABEL USE, DRUG INEFFECTIVE, HOSPITALISATION이 여기 해당합니다. FALL처럼 확률이 0.7에 못 미친 것은 아직 검토 목록에 남아 있습니다.</p>
<p style="margin: 0;"><b>라벨을 정답지로 쓴 것</b> 자체가 완전하지 않습니다. 라벨 본문에 용어가 그대로 없으면 미기재로 잡힙니다. 철자 정규화(ANAEMIA→ANEMIA)로 정밀도가 0.52에서 0.57로 올랐지만, 동의어까지는 처리하지 못했습니다.</p>
<p style="margin: 0;"><b>PRR·ROR은 동시 보고의 불균형</b>일 뿐 인과성이 아닙니다. 보고 편향과 적응증 혼동이 그대로 들어 있습니다.</p>
<p style="margin: 0;"><b>약물 10종 · 쌍 80건</b>은 시연 규모입니다. 이 수치로 도구 성능을 일반화할 수 없습니다.</p>

        { k: '빠른 분류 (Jev)', v: String(s1), s: '즉시 판정 · LLM 호출 0', c: '#65D9F1' },
        { k: '근거 검토', v: String(s2), s: 'LLM 호출 건', c: '#FFC445' },
        { k: '전문가 검토', v: String(hu), s: '중대 · 판정 불가', c: '#B76CFF' },
        { k: '줄어든 LLM 호출', v: s1 + ' / ' + eff.length, s: st.jev ? 'Jev 게이트 적용' : '게이트 끔', c: st.jev ? OK : 'var(--muted)' },
        { k: 'Jev 건당 지연', v: '3.4s', s: '문항 4개 동시 · 실측 중앙값', c: 'var(--text)' }
      ],
      jv: st.jev ? { label: 'Jev 게이트 켬', fg: '#08131A', bg: OK, bd: OK } : { label: 'Jev 게이트 끔', fg: 'var(--text)', bg: 'var(--panel)', bd: 'var(--line2)' },
      toggleJev: function () { self.setState({ jev: !self.state.jev }); },
      next: function () { self.setState({ sel: (self.state.sel + 1) % self.RAW.length }); }
    };
  }
}
dcMount(document.getElementById('tpl'), Component, document.getElementById('app'));
</script>
